<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://www.google.com/recaptcha/api.js"></script>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <title>Contacto</title>
</head>

<body id="body-contacto">

  <div class="div-contenido-body">
    <header class="header-contacto">

      <div class="div-img-portada" id="div-portada-contacto">
        <img class="img-portada" id="cover-contacto" src="assets/images/hills.png" alt="hills" />
      </div>

      <div class="div-titulo-h1">
        <h1>Contacto</h1>
      </div>

    </header>

    <article>

      <hr class="hr-1" id="hr-contacto">

      <h2>Enviar Correo Electrónico</h2>

      <form id="form-mensaje">

        <div>
          <input type="text" placeholder="Asunto" name="subject" id="subject" required />
        </div>

        <div>
          <textarea id="id-area-texto" placeholder="Tu mensaje" name="body" required></textarea>
        </div>

        <div id="id-boton-contacto">
          <button class="button" id="btn-enviar" type="submit">Enviar un Mensaje</button>
        </div>

        <!-- GIF de envío -->
        <div id="gif-enviando">
          <img src="assets/images/enviando.gif" alt="Enviando mensaje" id="gif-email">
        </div>

      </form>

      <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

      <script>
        document.addEventListener("DOMContentLoaded", function () {

          emailjs.init("PhiWONvqx3jqX0ZN3");

          const form = document.getElementById("form-mensaje");
          const boton = document.getElementById("btn-enviar");
          const gif = document.getElementById("gif-enviando");

          let enviando = false;

          form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (enviando) return;

            enviando = true;

            boton.style.display = "none";
            gif.style.display = "block";

            emailjs.send("service_roxfjfg", "template_ib1b5ov", {
              title: document.getElementById("subject").value,
              message: document.getElementById("id-area-texto").value,
              name: "Formulario Web",
              time: new Date().toLocaleString()
            })

              .then(function () {
                gif.style.display = "none";
                alert("Mensaje enviado correctamente ✅");
                form.reset();
              })

              .catch(function (error) {
                console.log(error);
                alert("Error al enviar ❌");

                enviando = false;
                gif.style.display = "none";
                boton.style.display = "block";
              });

          });

        });
      </script>

      <div class="div-redes-sociales">
        <nav class="nav-rrss">
          <a class="link-rrss" href="https://www.linkedin.com/in/nicolas9310" target="_blank" rel="noopener">
            <img src="assets/icons/rrss/in.png" class="ico-rrss" id="id-ico-in" alt="">
          </a>
        </nav>
      </div>

      <hr class="hr-1" id="hr-contacto">

    </article>

    <footer class="footer-index">

      <nav class="nav-footer">
        <a href="index.html">
          <img src="assets/images/mountain-blue.png" class="grow" id="img-mountain-blue" alt="">
          <p>Home</p>
        </a>

        <a href="experience.html">
          <img src="assets/images/blue-valley.png" class="grow" id="img-blue-valley" alt="">
          <p>Experiencia</p>
        </a>

        <a href="estudio.html">
          <img src="assets/images/forest.png" class="grow" id="img-sky" alt="">
          <p>Estudio</p>
        </a>

        <a href="contacto.html">
          <img src="assets/images/hills.png" class="grow" id="img-hills" alt="">
          <p>Contacto</p>
        </a>
      </nav>

    </footer>

    <br>
    <img class="img-end" src="assets/images/bird9.png" alt="bird">
  </div>

  <br>

</body>

</html>
